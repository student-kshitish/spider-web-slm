<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 900 780" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', system-ui, sans-serif">

  <!-- ── Background ── -->
  <rect width="900" height="780" rx="12" fill="#0d1117"/>

  <!-- ── Title ── -->
  <text x="450" y="44" text-anchor="middle" font-size="22" font-weight="700" fill="#e6edf3">Spider Web SLM — Architecture</text>
  <text x="450" y="68" text-anchor="middle" font-size="13" fill="#8b949e">4 rings × 8 nodes = 32 WebNodes  ·  Lorenz chaos routing  ·  Solar Ring Memory</text>

  <!-- ═══════════════════════════════════════════════════════════ -->
  <!-- RINGS  (cx=450, cy=420, radii 55/120/185/250)              -->
  <!-- ═══════════════════════════════════════════════════════════ -->

  <!-- Ring 3 — outermost -->
  <circle cx="450" cy="420" r="250" fill="none" stroke="#21262d" stroke-width="1.5" stroke-dasharray="6,4"/>
  <!-- Ring 2 -->
  <circle cx="450" cy="420" r="185" fill="none" stroke="#21262d" stroke-width="1.5" stroke-dasharray="6,4"/>
  <!-- Ring 1 -->
  <circle cx="450" cy="420" r="120" fill="none" stroke="#21262d" stroke-width="1.5" stroke-dasharray="6,4"/>
  <!-- Ring 0 — innermost -->
  <circle cx="450" cy="420" r="55"  fill="none" stroke="#21262d" stroke-width="1.5" stroke-dasharray="6,4"/>

  <!-- Ring labels (left side) -->
  <text x="197" y="424" text-anchor="end" font-size="11" fill="#6e7681">Ring 3</text>
  <text x="262" y="424" text-anchor="end" font-size="11" fill="#6e7681">Ring 2</text>
  <text x="327" y="424" text-anchor="end" font-size="11" fill="#6e7681">Ring 1</text>
  <text x="392" y="424" text-anchor="end" font-size="11" fill="#6e7681">Ring 0</text>

  <!-- ═══════════════════════════════════════════════════════════ -->
  <!-- NODES — computed at angles 0°,45°,90°…315° for each ring  -->
  <!-- r=55: Ring0  r=120: Ring1  r=185: Ring2  r=250: Ring3     -->
  <!-- ═══════════════════════════════════════════════════════════ -->

  <!-- helper: node circle + label macro via SVG use -->
  <!-- Ring 0  (innermost, r=55, accent #58a6ff) -->
  <g id="n0" fill="#58a6ff" stroke="#1f6feb" stroke-width="1.5">
    <circle r="9"/>
  </g>

  <!-- Ring 0 nodes -->
  <use href="#n0" transform="translate(505,420)"/>
  <use href="#n0" transform="translate(488.9,458.9)"/>
  <use href="#n0" transform="translate(450,474)"/>
  <use href="#n0" transform="translate(411.1,458.9)"/>
  <use href="#n0" transform="translate(395,420)"/>
  <use href="#n0" transform="translate(411.1,381.1)"/>
  <use href="#n0" transform="translate(450,366)"/>
  <use href="#n0" transform="translate(488.9,381.1)"/>

  <!-- Ring 1 nodes (#3fb950) -->
  <g id="n1" fill="#3fb950" stroke="#238636" stroke-width="1.5">
    <circle r="9"/>
  </g>
  <use href="#n1" transform="translate(570,420)"/>
  <use href="#n1" transform="translate(534.9,504.9)"/>
  <use href="#n1" transform="translate(450,539)"/>
  <use href="#n1" transform="translate(365.1,504.9)"/>
  <use href="#n1" transform="translate(330,420)"/>
  <use href="#n1" transform="translate(365.1,335.1)"/>
  <use href="#n1" transform="translate(450,301)"/>
  <use href="#n1" transform="translate(534.9,335.1)"/>

  <!-- Ring 2 nodes (#d29922) -->
  <g id="n2" fill="#d29922" stroke="#9e6a03" stroke-width="1.5">
    <circle r="9"/>
  </g>
  <use href="#n2" transform="translate(635,420)"/>
  <use href="#n2" transform="translate(580.8,550.8)"/>
  <use href="#n2" transform="translate(450,605)"/>
  <use href="#n2" transform="translate(319.2,550.8)"/>
  <use href="#n2" transform="translate(265,420)"/>
  <use href="#n2" transform="translate(319.2,289.2)"/>
  <use href="#n2" transform="translate(450,235)"/>
  <use href="#n2" transform="translate(580.8,289.2)"/>

  <!-- Ring 3 nodes (#f0883e) -->
  <g id="n3" fill="#f0883e" stroke="#b04900" stroke-width="1.5">
    <circle r="9"/>
  </g>
  <use href="#n3" transform="translate(700,420)"/>
  <use href="#n3" transform="translate(626.8,596.8)"/>
  <use href="#n3" transform="translate(450,670)"/>
  <use href="#n3" transform="translate(273.2,596.8)"/>
  <use href="#n3" transform="translate(200,420)"/>
  <use href="#n3" transform="translate(273.2,243.2)"/>
  <use href="#n3" transform="translate(450,170)"/>
  <use href="#n3" transform="translate(626.8,243.2)"/>

  <!-- ═══════════════════════════════════════════════════════════ -->
  <!-- INWARD ROUTING ARROWS  (Ring3→Ring2, Ring2→Ring1, Ring1→Ring0) -->
  <!-- Shown on the right-hand side at 0° (east) for clarity      -->
  <!-- ═══════════════════════════════════════════════════════════ -->

  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="6" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#8b949e"/>
    </marker>
    <marker id="arr-b" markerWidth="8" markerHeight="6" refX="6" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#58a6ff"/>
    </marker>
  </defs>

  <!-- Ring3 → Ring2 (east, y=420) -->
  <line x1="691" y1="414" x2="644" y2="414" stroke="#8b949e" stroke-width="1.5"
        marker-end="url(#arr)" opacity="0.7"/>
  <text x="667" y="408" text-anchor="middle" font-size="9.5" fill="#6e7681">route in</text>

  <!-- Ring2 → Ring1 (east) -->
  <line x1="626" y1="414" x2="579" y2="414" stroke="#8b949e" stroke-width="1.5"
        marker-end="url(#arr)" opacity="0.7"/>

  <!-- Ring1 → Ring0 (east) -->
  <line x1="561" y1="414" x2="514" y2="414" stroke="#8b949e" stroke-width="1.5"
        marker-end="url(#arr)" opacity="0.7"/>

  <!-- Token enters from left at Ring3 -->
  <line x1="130" y1="420" x2="191" y2="420" stroke="#58a6ff" stroke-width="2"
        marker-end="url(#arr-b)"/>
  <text x="88" y="416" font-size="12" fill="#58a6ff" font-weight="600">token</text>
  <text x="88" y="430" font-size="12" fill="#58a6ff" font-weight="600">input</text>

  <!-- Token exits right (stay / exit) -->
  <line x1="709" y1="420" x2="768" y2="420" stroke="#58a6ff" stroke-width="2"
        marker-end="url(#arr-b)"/>
  <text x="774" y="416" font-size="12" fill="#58a6ff" font-weight="600">stay /</text>
  <text x="774" y="430" font-size="12" fill="#58a6ff" font-weight="600">exit</text>

  <!-- ═══════════════════════════════════════════════════════════ -->
  <!-- CALLOUT BOXES                                               -->
  <!-- ═══════════════════════════════════════════════════════════ -->

  <!-- Lorenz Router callout — lower right -->
  <rect x="620" y="590" width="230" height="72" rx="8"
        fill="#161b22" stroke="#1f6feb" stroke-width="1.5"/>
  <text x="735" y="610" text-anchor="middle" font-size="12.5" font-weight="700" fill="#58a6ff">Lorenz Router</text>
  <text x="735" y="627" text-anchor="middle" font-size="11" fill="#8b949e">proj_in → 5-step ODE</text>
  <text x="735" y="643" text-anchor="middle" font-size="11" fill="#8b949e">→ proj_out → Gumbel-softmax</text>
  <text x="735" y="657" text-anchor="middle" font-size="11" fill="#8b949e">3-way: stay / jump-in / exit</text>
  <!-- connector line from arrow area to box -->
  <line x1="700" y1="429" x2="700" y2="590" stroke="#1f6feb" stroke-width="1"
        stroke-dasharray="4,3" opacity="0.5"/>

  <!-- Solar Ring Memory callout — lower left -->
  <rect x="50" y="590" width="240" height="72" rx="8"
        fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
  <text x="170" y="610" text-anchor="middle" font-size="12.5" font-weight="700" fill="#3fb950">Solar Ring Memory (SRM)</text>
  <text x="170" y="627" text-anchor="middle" font-size="11" fill="#8b949e">32 slots per node  ·  α·M_old + β·(gate⊙h)</text>
  <text x="170" y="643" text-anchor="middle" font-size="11" fill="#8b949e">gravity-read via softmax scores</text>
  <text x="170" y="657" text-anchor="middle" font-size="11" fill="#8b949e">constant memory cost O(1) in seq_len</text>
  <line x1="200" y1="429" x2="200" y2="590" stroke="#3fb950" stroke-width="1"
        stroke-dasharray="4,3" opacity="0.5"/>

  <!-- 3-axis RoPE callout — top -->
  <rect x="330" y="90" width="240" height="58" rx="8"
        fill="#161b22" stroke="#d29922" stroke-width="1.5"/>
  <text x="450" y="110" text-anchor="middle" font-size="12.5" font-weight="700" fill="#d29922">3-Axis Polar RoPE</text>
  <text x="450" y="127" text-anchor="middle" font-size="11" fill="#8b949e">Temporal · Angular · Radial</text>
  <text x="450" y="143" text-anchor="middle" font-size="11" fill="#8b949e">no absolute positional table</text>
  <line x1="450" y1="148" x1="450" x2="450" y2="170" stroke="#d29922" stroke-width="1"
        stroke-dasharray="4,3" opacity="0.5"/>

  <!-- WebNode label at centre -->
  <rect x="395" y="397" width="110" height="46" rx="6"
        fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="450" y="415" text-anchor="middle" font-size="10.5" font-weight="700" fill="#e6edf3">WebNode</text>
  <text x="450" y="430" text-anchor="middle" font-size="9.5" fill="#8b949e">SwiGLU · SRM · Lorenz</text>
  <text x="450" y="441" text-anchor="middle" font-size="9" fill="#6e7681">lateral attn (ring peers)</text>

  <!-- ── Legend ── -->
  <rect x="22" y="90" width="160" height="100" rx="8"
        fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="102" y="110" text-anchor="middle" font-size="11" font-weight="700" fill="#e6edf3">Legend</text>
  <circle cx="42" cy="128" r="7" fill="#f0883e" stroke="#b04900" stroke-width="1.5"/>
  <text x="56" y="132" font-size="10.5" fill="#8b949e">Ring 3 (outer)</text>
  <circle cx="42" cy="148" r="7" fill="#d29922" stroke="#9e6a03" stroke-width="1.5"/>
  <text x="56" y="152" font-size="10.5" fill="#8b949e">Ring 2</text>
  <circle cx="42" cy="168" r="7" fill="#3fb950" stroke="#238636" stroke-width="1.5"/>
  <text x="56" y="172" font-size="10.5" fill="#8b949e">Ring 1</text>
  <circle cx="42" cy="188" r="7" fill="#58a6ff" stroke="#1f6feb" stroke-width="1.5"/>
  <text x="56" y="192" font-size="10.5" fill="#8b949e">Ring 0 (inner)</text>

</svg>
